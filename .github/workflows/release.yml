# Builds the Windows installer when a version tag (v0.2.0, ...) is pushed and
# publishes it as a GitHub release, with the signed latest.json that installed
# copies of Hearth check for updates.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Actions are pinned to commits, not tags: the updater signing key passes
# through tauri-action, and a moved tag could hand it to someone who could then
# ship updates every installed Hearth trusts. To bump one, look up the new
# tag's commit: git ls-remote https://github.com/<owner>/<repo> <tag>

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - run: npm ci
        working-directory: app

      # The tag is the version: write it into Cargo.toml and package.json so
      # the installer and latest.json can't disagree with the release name.
      - name: Version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          (Get-Content Cargo.toml -Raw) -replace '(?m)(\[workspace\.package\]\r?\nversion = )"[^"]*"', "`$1`"$version`"" | Set-Content Cargo.toml -NoNewline
          if (-not (Select-String -Path Cargo.toml -Pattern "^version = `"$version`"" -Quiet)) { throw "Could not set the version in Cargo.toml" }
          Push-Location app
          npm version $version --no-git-tag-version --allow-same-version
          Pop-Location

      - run: cargo test --workspace --exclude hearth

      # The release notes are this version's section of CHANGELOG.md: from
      # "## 0.3.0" to the next "## ". No section, no release: a version
      # shouldn't go out without saying what changed.
      - name: Release notes from CHANGELOG.md
        id: notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $lines = Get-Content CHANGELOG.md
          $start = [Array]::IndexOf($lines, "## $version")
          if ($start -lt 0) { throw "CHANGELOG.md has no '## $version' section" }
          $body = @()
          foreach ($line in $lines[($start + 1)..($lines.Count - 1)]) {
            if ($line -match '^## ') { break }
            $body += $line
          }
          $text = ($body -join "`n").Trim()
          if (-not $text) { throw "The '## $version' section of CHANGELOG.md is empty" }
          $delimiter = "NOTES_" + [guid]::NewGuid().ToString("N")
          "body<<$delimiter`n$text`n$delimiter" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: Hearth ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
