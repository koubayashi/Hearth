<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Lit from above, so the tile stands apart from a dark taskbar. -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#323238"/>
      <stop offset="1" stop-color="#1C1C1E"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#tile)"/>
  <!-- A faint light edge, drawn inside the tile. -->
  <rect x="12" y="12" width="1000" height="1000" rx="212" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="24"/>
  <!-- The flame fills 74% of the tile's height, set a little below centre
       because it is heavy at the bottom. -->
  <g transform="translate(512 506) scale(1.37) translate(-512 -492)">
    <path d="M512 214c40 120 196 190 196 360a196 196 0 0 1-392 0c0-96 52-150 92-196 6 70 40 112 84 128-24-110 0-200 20-292z" fill="#ECE7DF"/>
    <path d="M512 520c26 52 92 82 92 160a92 92 0 0 1-184 0c0-50 30-80 52-100 6 32 24 52 40 58-8-40 0-82 0-118z" fill="#FF6A48"/>
  </g>
</svg>
