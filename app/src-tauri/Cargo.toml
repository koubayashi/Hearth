[package]
name = "hearth"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hub-core.workspace = true
hub-launch.workspace = true
hub-providers.workspace = true
serde.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
hub-tracker.workspace = true
window-vibrancy = "0.6"
tokio = { workspace = true }

# Clearing the old shared profile's cookies (auth.rs). Same versions Tauri uses.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
# The invisible window over the Maximize button (snap_layouts.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
