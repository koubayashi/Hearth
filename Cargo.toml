[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
hub-core = { path = "crates/hub-core" }
hub-providers = { path = "crates/hub-providers" }
hub-launch = { path = "crates/hub-launch" }
hub-tracker = { path = "crates/hub-tracker" }

[profile.release]
lto = true
codegen-units = 1
strip = true
